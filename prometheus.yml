global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "user-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["userservice:8080"]

  - job_name: "product-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["productservice:8080"]

  - job_name: "order-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["orderservice:8080"]